<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  .stage{position:relative;width:1080px;height:1440px;overflow:hidden;
    background:radial-gradient(900px 700px at 22% 26%,#0C1420 0%,#05070B 60%),#05070B;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#F2F6EC}
  .orb{position:absolute;border-radius:50%;filter:blur(100px)}
  .orb.lime{width:540px;height:540px;right:-180px;top:300px;background:rgba(200,255,61,.12)}
  .orb.cyan{width:560px;height:560px;left:-180px;top:-140px;background:rgba(83,232,255,.09)}
  .floor{position:absolute;left:-25%;right:-25%;bottom:-160px;height:460px;
    background-image:linear-gradient(rgba(200,255,61,.13) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(200,255,61,.13) 1px,transparent 1px);
    background-size:60px 60px;transform:perspective(760px) rotateX(62deg);transform-origin:50% 100%;
    -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 62%)}
  .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 4px)}
  .noise{position:absolute;inset:0;opacity:.045;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/></filter><rect width="220" height="220" filter="url(%23n)" opacity="0.7"/></svg>')}
  .br{position:absolute;width:26px;height:26px;border:2px solid rgba(200,255,61,.55)}
  .br.tl{top:30px;left:30px;border-right:none;border-bottom:none}
  .br.tr{top:30px;right:30px;border-left:none;border-bottom:none}
  .br.bl{bottom:30px;left:30px;border-right:none;border-top:none}
  .br.brr{bottom:30px;right:30px;border-left:none;border-top:none}
  .mono{font-family:"Consolas","Cascadia Mono",monospace}

  .top{position:absolute;left:64px;right:64px;top:62px}
  .top-row{display:flex;justify-content:space-between;align-items:center;font:400 20px Consolas;letter-spacing:2px}
  .top-row .l{color:#C8FF3D}
  .top-row .r{color:rgba(242,246,236,.4)}
  .seg{margin-top:20px;display:flex;gap:6px}
  .seg i{flex:1;height:5px;background:rgba(242,246,236,.12)}
  .seg i.on{background:#C8FF3D;box-shadow:0 0 10px rgba(200,255,61,.6)}
  .rule{margin-top:22px;height:1px;background:linear-gradient(90deg,rgba(200,255,61,.6),transparent 70%)}

  .title{position:absolute;left:64px;top:196px}
  h1{font-size:124px;font-weight:900;letter-spacing:4px;line-height:1}
  h1 .lit{background:linear-gradient(180deg,#EDFFBE,#C8FF3D);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px rgba(200,255,61,.35))}
  .latin{margin-top:14px;font-family:Impact,"Arial Narrow",sans-serif;font-size:30px;letter-spacing:5px;
    color:transparent;-webkit-text-stroke:1.3px rgba(242,246,236,.4)}
  .sub{margin-top:16px;font-size:33px;font-weight:700;color:rgba(242,246,236,.85)}
  .sub em{font-style:normal;color:#C8FF3D}

  /* visual: 3x3 sort grid */
  .viz{position:absolute;left:0;right:0;top:478px;height:600px}
  .board{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:500px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .cell{position:relative}
  .t{aspect-ratio:1;border-radius:24px;display:flex;align-items:center;justify-content:center;
    font-size:58px;font-family:"Segoe UI Emoji",sans-serif;box-shadow:inset 0 0 0 1px rgba(255,255,255,.13),0 14px 30px rgba(0,0,0,.4)}
  .slot{aspect-ratio:1;border-radius:24px;display:flex;align-items:center;justify-content:center;
    border:2px dashed rgba(242,246,236,.28);font:400 19px Consolas;color:rgba(242,246,236,.4)}
  .slot.dst{border:2px dashed rgba(200,255,61,.9);color:#C8FF3D;box-shadow:0 0 26px rgba(200,255,61,.25),inset 0 0 22px rgba(200,255,61,.12)}
  .lift{position:absolute;left:216px;top:178px;width:170px;height:170px;border-radius:26px;z-index:6;
    display:flex;align-items:center;justify-content:center;font-size:82px;font-family:"Segoe UI Emoji",sans-serif;
    background:linear-gradient(135deg,#FFD54A,#FF8A3D);transform:rotate(-9deg) scale(1.1);
    box-shadow:0 0 0 3px rgba(200,255,61,.95),0 26px 60px rgba(0,0,0,.6),0 0 60px rgba(200,255,61,.5)}
  .trail{position:absolute;left:50%;top:6px;transform:translateX(-50%);z-index:5}
  .ann{position:absolute;font:400 18px Consolas;letter-spacing:2px;color:rgba(200,255,61,.85);
    background:rgba(5,7,11,.72);border:1px solid rgba(200,255,61,.45);border-radius:6px;padding:7px 12px}
  .ann.gray{color:rgba(242,246,236,.55);border-color:rgba(242,246,236,.3)}
  .drag-tag{position:absolute;left:400px;top:150px;padding:5px 12px;background:#C8FF3D;color:#0B100A;
    font:700 15px Consolas;letter-spacing:1px;border-radius:5px;z-index:7}

  /* rows */
  .rows{position:absolute;left:64px;right:64px;top:1102px}
  .row{display:flex;align-items:center;gap:26px;padding:21px 6px;border-top:1px solid rgba(255,255,255,.09)}
  .row:first-child{border-top:none}
  .idx{font:700 26px Consolas;color:#C8FF3D;letter-spacing:1px;width:52px}
  .rt{font-size:30px;font-weight:900;letter-spacing:1px;white-space:nowrap}
  .rd{margin-left:auto;font:400 20px Consolas;letter-spacing:1px;color:rgba(242,246,236,.55);text-align:right}
  .arw{color:rgba(200,255,61,.6);font-size:22px}

  .bottom{position:absolute;left:64px;right:64px;bottom:58px;display:flex;justify-content:space-between;align-items:center;
    font:400 19px Consolas;letter-spacing:2px;color:rgba(242,246,236,.45)}
  .bottom .d{color:#C8FF3D}
</style>
</head>
<body>
<div class="stage">
  <div class="orb lime"></div><div class="orb cyan"></div>
  <div class="floor"></div>
  <div class="br tl"></div><div class="br tr"></div><div class="br bl"></div><div class="br brr"></div>

  <div class="top">
    <div class="top-row mono"><span class="l">MODULE 02 // FREE SORT</span><span class="r">HAQI-STATION.SYS</span></div>
    <div class="seg"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div>
    <div class="rule"></div>
  </div>

  <div class="title">
    <h1>自由<span class="lit">排序</span></h1>
    <div class="latin">FREE SORT — DRAG &amp; LOCK</div>
    <div class="sub">长按拖拽 · <em>顺序自动存档</em></div>
  </div>

  <div class="viz">
    <div class="board">
      <div class="grid">
        <div class="cell"><div class="t" style="background:linear-gradient(135deg,#7CFFB2,#2BD9A9)">🐸</div></div>
        <div class="cell"><div class="slot dst">01</div></div>
        <div class="cell"><div class="t" style="background:linear-gradient(135deg,#8AB4FF,#5A7BFF)">🗿</div></div>
        <div class="cell"><div class="t" style="background:linear-gradient(135deg,#FF9AE0,#C15BFF)">🤡</div></div>
        <div class="cell"><div class="t" style="background:linear-gradient(135deg,#5EE7FF,#2B9BFF)">👽</div></div>
        <div class="cell"><div class="t" style="background:linear-gradient(135deg,#FFE066,#F5A623)">🔥</div></div>
        <div class="cell"><div class="t" style="background:linear-gradient(135deg,#B5FF5C,#4DD441)">🐶</div></div>
        <div class="cell"><div class="slot">09</div></div>
        <div class="cell"><div class="t" style="background:linear-gradient(135deg,#C9B6FF,#8B5CF6)">🎈</div></div>
      </div>
      <svg class="trail" width="500" height="532" viewBox="0 0 500 532" fill="none">
        <path d="M 250 448 C 130 420, 90 320, 160 220 S 240 80, 250 92"
              stroke="rgba(200,255,61,.8)" stroke-width="3" stroke-dasharray="12 10" fill="none"/>
        <path d="M 250 92 l -14 -13 m 14 13 l -18 4" stroke="rgba(200,255,61,.8)" stroke-width="3"/>
      </svg>
      <div class="lift">😹</div>
      <div class="drag-tag mono">// DRAG</div>
    </div>
    <div class="ann mono" style="left:688px;top:64px">TARGET: 01 ▸ 置顶位</div>
    <div class="ann gray mono" style="left:688px;top:470px">FROM: 09 ▸ 原位</div>
  </div>

  <div class="rows">
    <div class="row">
      <span class="idx mono">01</span><span class="rt">长按即拖</span>
      <span class="rd mono">松手自动存档 · 顺序永不丢</span><span class="arw">▸</span>
    </div>
    <div class="row">
      <span class="idx mono">02</span><span class="rt">T0 置顶</span>
      <span class="rd mono">常用战力 · 抬手就甩</span><span class="arw">▸</span>
    </div>
    <div class="row">
      <span class="idx mono">03</span><span class="rt">全图重排</span>
      <span class="rd mono">想放哪就放哪 · 牌面自定义</span><span class="arw">▸</span>
    </div>
  </div>

  <div class="bottom mono">
    <span>HAQI STATION · 表情包管理终端 · ANDROID</span>
    <span>●<span class="d">●</span>○</span>
  </div>

  <div class="scan"></div>
  <div class="noise"></div>
</div>
</body>
</html>
